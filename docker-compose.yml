# Made Easy Educational Consultancy platform — full stack.
#
# The same file is used locally and on the Hostinger VPS; behaviour differs only
# through values in .env (APP_ENV, SITE_ADDRESS, credentials, ...).
#
#   docker compose up -d --build

name: madeeasy

x-app-image: &app-image
  image: madeeasy-app:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    # Persistent storage: private uploads (storage/app/private), logs, sessions.
    - app_storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  networks:
    - internal

services:
  app:
    <<: *app-image
    build:
      context: .
      target: app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app-image
    # Uses the image built by the "app" service.
    pull_policy: never
    command: ["php", "artisan", "queue:work", "database", "--sleep=3", "--tries=3", "--max-time=3600"]
    stop_grace_period: 60s
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  caddy:
    build:
      context: .
      target: caddy
    image: madeeasy-caddy:latest
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-madeeasy}
      POSTGRES_USER: ${DB_USERNAME:-madeeasy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  app_storage:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
