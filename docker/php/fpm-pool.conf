[www]
; Used by the docker-compose healthcheck (cgi-fcgi -> /ping).
ping.path = /ping
ping.response = pong

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Pass container env vars (from .env via env_file) through to PHP.
clear_env = no
