; Application PHP overrides (loaded after the image defaults).

expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
; Service request forms may carry several 5 MB files (config/madeeasy.php uploads).
post_max_size = 26M
max_execution_time = 60

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Re-check file timestamps so edits are picked up; the image is rebuilt on deploy anyway.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
